manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: cormoran
      url-base: https://github.com/cormoran
    - name: caksoylar
      url-base: https://github.com/caksoylar
  projects:
    # cormoran's ZMK fork (v0.3 / Zephyr 3.5 base) with DYA Studio support.
    - name: zmk
      remote: cormoran
      revision: 4493783ef88ce2e653bf8217c92ee17140df71e3  # track: v0.3-branch+dya
      import: app/west.yml
    # Zephyr override: zmk/app/west.yml pins zephyr by *branch* name, so it is
    # redeclared here to freeze it. Keep clone-depth and name-blocklist identical
    # to zmk/app/west.yml; only `revision` differs. Mirror upstream changes when
    # bumping zmk.
    - name: zephyr
      remote: zmkfirmware
      revision: dacab4875df72109b96cc8977547a0dc04875bcd  # track: v3.5.0+zmk-fixes
      clone-depth: 1
      import:
        name-blocklist:
          - ci-tools
          - hal_altera
          - hal_cypress
          - hal_infineon
          - hal_microchip
          - hal_nxp
          - hal_openisa
          - hal_silabs
          - hal_xtensa
          - hal_st
          - hal_ti
          - loramac-node
          - mcuboot
          - mcumgr
          - net-tools
          - openthread
          - edtt
          - trusted-firmware-m
    # PMW3610 driver: badjeff-style input-subsystem driver with DYA Studio
    # custom RPC (surface diagnostics). compatible = "cormoran,pmw3610".
    # Replaces inorichi/zmk-pmw3610-driver; do not use both.
    - name: zmk-driver-pmw3610-with-custom-studio-rpc
      remote: cormoran
      revision: 5c34ea0eec246a1c986111417cd779b53144629a  # track: main
    - name: zmk-rgbled-widget
      remote: caksoylar
      revision: 8756cb7b8114069fa3c25c6f6c990f24988fceff  # track: v0.3-branch
    # DYA Studio modules (cormoran), pinned to v0.3-compatible tags/SHAs.
    - name: zmk-module-runtime-input-processor
      remote: cormoran
      revision: zmk-v0.3.0.0  # track: tags
    - name: zmk-behavior-runtime-sensor-rotate
      remote: cormoran
      revision: zmk-v0.3.0.0  # track: tags
    - name: zmk-module-ble-management
      remote: cormoran
      revision: zmk-v0.3.0.0  # track: tags
    - name: zmk-module-settings-rpc
      remote: cormoran
      revision: zmk-v0.3.0.0  # track: tags
    # No v0.3 tag exists; this main SHA is known to build on v0.3-branch+dya.
    - name: zmk-module-battery-history
      remote: cormoran
      revision: 307755dd2ad4d320e14de162e8e5ef018f29d929  # track: main
    # DYA Studio diagnostics modules. No v0.3 tags exist; pinned main SHAs.
    - name: zmk-feature-device-info
      remote: cormoran
      revision: 8cedd2dd9f04e19ea5a17b94914dd47a09d8db11  # track: main
    - name: zmk-feature-watchdog
      remote: cormoran
      revision: 84ad14c6c3645dc40b23f45d08ab45418655f912  # track: main
    - name: zmk-feature-kscan-diagnostics
      remote: cormoran
      revision: 1432f7fe0cfe903cd7d3c9931ae6bd6f2e1f328e  # track: main
    - name: zmk-module-devtool
      remote: cormoran
      revision: 9938a2c73c06d6e65ba2c0b68c9aa044a467eafc  # track: main
  self:
    path: config
