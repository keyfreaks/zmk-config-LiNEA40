# LiNEA40 左手 = peripheral。Studio とは右手経由でやり取りする。
# 構成の参考: DYA Studio 開発者ガイド (Level 2)、sayu-hub/zmk-config-moNa2-v2

# ===== ハードウェア基本 =====
# col4 / col5 に NFC 端子を使うため GPIO 化 (Zephyr 4.1 では非推奨扱いの設定)
CONFIG_NFCT_PINS_AS_GPIOS=y
# 使わないシリアルコンソールを切る
CONFIG_CONSOLE=n

# ===== ロータリーエンコーダ (EC11) =====
# 割り込み処理を専用スレッドで行う
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_OWN_THREAD=y
CONFIG_EC11_THREAD_PRIORITY=7
CONFIG_EC11_THREAD_STACK_SIZE=2048

# ===== 電池 =====
CONFIG_ZMK_BATTERY_REPORTING=y

# ===== 状態表示 LED (rgbled-widget) =====
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10

# ===== 左右間の中継 =====
# データ長は右手と必ず同じ値にする (256 にしている理由は右手の .conf を参照)
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=256
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048

# ===== DYA Studio 連携 (左手側) =====
# 右手から届く設定変更を受けて保存する
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y
# スリープ時間などを右手と同期する
CONFIG_ZMK_SETTINGS_RPC=y
# 左手のキースイッチ統計を取り、右手へ返す
CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_MAX_POSITIONS=48
# 左手の再起動原因やクラッシュも記録する (Studio で左手を選ぶと見られる)
CONFIG_ZMK_WATCHDOG=y
# 保存済み設定の一覧は、分割時に既定で有効になる ZMK_SETTING_EXPOSE_SPLIT が応答する。
# 本体の ZMK_SETTING_EXPOSE は Studio を持つ右手だけで有効にする
# 左手経由の通信速度計測に応答する
CONFIG_ZMK_STUDIO_RPC_PERF=y
CONFIG_ZMK_STUDIO_RPC_PERF_SPLIT_RPC_RELAY=y

# 設定をフラッシュへ書くまでの待ち時間を右手と揃える
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000
