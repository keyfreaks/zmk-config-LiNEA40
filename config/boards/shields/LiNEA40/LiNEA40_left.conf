# GPIO: NFC ピンの GPIO 化は Zephyr 4.1 では overlay の
# &uicr { nfct-pins-as-gpios; } で行う (CONFIG_NFCT_PINS_AS_GPIOS は廃止)

# Zephyr 4.1 ではコンソールが既定で有効だが不要 (DYA2 と同じ)
CONFIG_CONSOLE=n

# EC11 Encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Mouse Emulation
CONFIG_ZMK_POINTING=y

CONFIG_ZMK_BATTERY_REPORTING=y

CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10

# ---- DYA Studio (peripheral 側。Studio 本体は右=central) ----
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
# 左右で同じ値にすること
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=240
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048
# DYA2 の左側 (peripheral) と同じく custom-settings をリレーで公開
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y
# 左半分のキースイッチ診断
CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
# 左半分の致命的エラー/再起動原因を右 (Studio) へリレー。
# フリーズ検出は BLE 分割で BLE コントローラーの assert を誘発しうるため無効。
CONFIG_ZMK_WATCHDOG=y
CONFIG_ZMK_WATCHDOG_FREEZE_DETECT=n

# Windows でペアリング中に LL Procedure Collision (0x23) で切断されるため、
# 2M PHY 等の接続安定化設定を有効化（左右で揃える）
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
