# LiNEA40 右手 = central。DYA Studio はこちらに USB / BLE で接続する。
# 構成の参考: DYA Studio 開発者ガイド (Level 2)、sayu-hub/zmk-config-moNa2-v2

# ===== ハードウェア基本 =====
# col4 と SPI の CS に NFC 端子を使うため GPIO 化 (Zephyr 4.1 では非推奨扱いの設定)
CONFIG_NFCT_PINS_AS_GPIOS=y
# 使わないシリアルコンソールを切る
CONFIG_CONSOLE=n

# BLE 名 "keyFreaksLiNEA40" は 16 文字。名前を実行時に変えられる設定では
# この値が終端文字込みのバッファ長になるため、16 文字なら 17 が必要。
# 広告パケットは名前込みでちょうど 31 バイトになり、これ以上は伸ばせない。
CONFIG_BT_DEVICE_NAME_MAX=17

# ===== トラックボール (PMW3610) =====
CONFIG_ZMK_POINTING=y
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_PMW3610=y
CONFIG_PMW3610_SMART_ALGORITHM=y
# レポート間隔 8ms (125Hz)
CONFIG_PMW3610_REPORT_INTERVAL_MIN=8
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=40
CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=9600
# Y 軸反転の初期値 (Studio の Trackball 画面で変更可)
CONFIG_PMW3610_INVERT_Y=y
# Trackball 画面のセンサー診断と、変更値のフラッシュ保存
CONFIG_ZMK_PMW3610_STUDIO_RPC=y
CONFIG_ZMK_PMW3610_CUSTOM_SETTINGS=y

# ===== 電池 =====
# 左手の残量も中継してホストへ通知する
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# ===== 状態表示 LED (rgbled-widget) =====
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10

# ===== ZMK Studio 本体 =====
CONFIG_ZMK_STUDIO=y
# ロックは既定 (有効) のまま。&studio_unlock で解除してから接続する。
# ロックを切ったビルドでは USB / BLE とも DYA Studio に接続できなかった。
# 解除時に BLE 広告を再開する機能 (ZMK_STUDIO_LOCK_BLE_DIRECT_ADVERTISING_ON_UNLOCK)
# も既定で有効になり、ブラウザが BLE でキーボードを見つけられる。
# 余分な USB シリアル (コンソール用) は作らない。devicetree 側でも無効化している
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n

# ===== DYA Studio 基盤 =====
# 各ランタイム機能が設定を保存する土台。左手の設定も中継する
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y
CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y
# 1 項目あたりの最大サイズ。マクロ 1 本 (最大 256B) が入る大きさにする
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256
# キーマップを差分で速く読み込む
CONFIG_ZMK_FAST_KEYMAP=y
CONFIG_ZMK_FAST_KEYMAP_STUDIO_RPC=y
CONFIG_ZMK_FAST_KEYMAP_DEFAULT_LAYER=y

# ===== Keymap 画面 (エンコーダ / コンボ / マクロ / タップダンス) =====
# エンコーダ (左手に実装) のレイヤーごとの割り当て。keymap の &rsr_*
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE=y
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE_STUDIO_RPC=y
# コンボ。初期値は keymap の runtime_combo_defaults
CONFIG_ZMK_RUNTIME_COMBO=y
CONFIG_ZMK_RUNTIME_COMBO_STUDIO_RPC=y
CONFIG_ZMK_RUNTIME_COMBO_MAX_COMBOS=16
# 判定時間は以前の静的コンボと同じ 50ms
CONFIG_ZMK_RUNTIME_COMBO_DEFAULT_TIMEOUT_MS=50
# マクロ。キーには &rmacro <番号> で割り当てる
CONFIG_ZMK_RUNTIME_MACRO=y
CONFIG_ZMK_RUNTIME_MACRO_STUDIO_RPC=y
CONFIG_ZMK_RUNTIME_MACRO_COUNT=8
CONFIG_ZMK_RUNTIME_MACRO_POOL_BYTES=1024
CONFIG_ZMK_RUNTIME_MACRO_MAX_BYTES=256
# タップダンス。キーには &rtd <番号> で割り当てる
CONFIG_ZMK_RUNTIME_TAPDANCE=y
CONFIG_ZMK_RUNTIME_TAPDANCE_STUDIO_RPC=y
# 割り当ての保存形式。CRC16 方式は IN_BINDINGS を自動では有効にしないので明示する。
# これが無いと Studio でエンコーダの割り当てを変えた後に反応しなくなる
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y
CONFIG_ZMK_BEHAVIOR_LOCAL_IDS_IN_BINDINGS=y
# 押しているキーをリアルタイムに表示する
CONFIG_ZMK_INPUT_STREAM_FEATURE=y
CONFIG_ZMK_INPUT_STREAM_FEATURE_STUDIO_RPC=y
# プレビューへのトラックボール / エンコーダの図示 (physical-layout) は、
# ラベルが見切れるうえ操作もできないため入れていない

# ===== Trackball 画面 (速度・回転・オートマウスなど) =====
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y

# ===== Connection 画面 =====
# BLE プロファイルの名前変更・切替・削除
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y
# 接続先 OS ごとの既定レイヤー。LiNEA40 のベースはレイヤー 0 だけなので範囲は 0..0
CONFIG_ZMK_DEFAULT_LAYER=y
CONFIG_ZMK_DEFAULT_LAYER_MIN_INDEX=0
CONFIG_ZMK_DEFAULT_LAYER_MAX_INDEX=0
CONFIG_ZMK_DEFAULT_LAYER_STUDIO_RPC=y
CONFIG_ZMK_DEFAULT_LAYER_OS_DETECTION=y
# 上の既定レイヤーが使う OS 判定。os-detection 独自のレイヤー自動切替
# (CONFIG_ZMK_OS_DETECTION_LAYER_*) は既定レイヤーとぶつかるので有効にしない
CONFIG_ZMK_OS_DETECTION=y
CONFIG_ZMK_OS_DETECTION_USB=y
CONFIG_ZMK_OS_DETECTION_BLE=y
CONFIG_ZMK_OS_DETECTION_STUDIO_RPC=y

# ===== Settings 画面 =====
# スリープまでの時間など。Studio 連携のフラグ名は _STUDIO (末尾に _RPC は付かない)
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y
# 電池履歴 (battery-history) は保存が遅い既知の問題があるため入れていない

# ===== Troubleshooting 画面 (診断) =====
# キースイッチ診断。左手の分は中継で集める
CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_STUDIO_RPC=y
# キーは 41 個。記録枠を既定 128 から 48 に減らして RAM を空ける
CONFIG_ZMK_KSCAN_DIAGNOSTICS_MAX_POSITIONS=48
# ファームウェアのビルド情報・稼働時間など
CONFIG_ZMK_DEVICE_INFO=y
CONFIG_ZMK_DEVICE_INFO_STUDIO_RPC=y
# 再起動原因やクラッシュの記録
CONFIG_ZMK_WATCHDOG=y
CONFIG_ZMK_WATCHDOG_STUDIO_RPC=y
# スレッドごとのスタック使用量 (ログ取り込みは RAM を食うので無効のまま)
CONFIG_ZMK_DEVTOOL=y
CONFIG_ZMK_DEVTOOL_STUDIO_RPC=y
CONFIG_ZMK_DEVTOOL_STACK_USAGE=y
# Zephyr の保存済み設定の一覧表示
CONFIG_ZMK_SETTING_EXPOSE=y
# Studio との通信速度の計測 (左手経由の計測を含む)
CONFIG_ZMK_STUDIO_RPC_PERF=y
CONFIG_ZMK_STUDIO_RPC_PERF_HANDLER=y
CONFIG_ZMK_STUDIO_RPC_PERF_SPLIT_RPC_RELAY=y

# ===== 左右間の中継 =====
# 1 回に運べるデータ長。左右で同じ値にしないと中継が壊れる。
# setting-expose は 512 を勧めているが、custom-settings 側のチェックが
# 512 ではビルドを止めるので、両方が通る 256 にしている
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=256

# ===== BLE 接続間隔 =====
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12

# ===== 通信バッファとスタック =====
# Studio 向けの独自 RPC を多く入れているので、受け渡しバッファと
# 関係するスレッドのスタックを広げる (DYA2 などで使われている値)
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=512
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=512
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=512
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=768
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=6000

# Studio で変えた設定を 10 秒後にフラッシュへ書く (既定より短くして消えにくくする)
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000
