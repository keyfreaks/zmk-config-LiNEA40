# GPIO
CONFIG_NFCT_PINS_AS_GPIOS=y

# Mouse Emulation
CONFIG_ZMK_POINTING=y

# Trackball (cormoran/zmk-driver-pmw3610-with-custom-studio-rpc, badjeff ベース)
# CPI は overlay の cpi = <800>、スナイプ/オートマウス/スクロールは
# overlay の input-processor で設定（旧 inorichi 版 Kconfig は廃止）。
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_PMW3610=y
CONFIG_PMW3610_SMART_ALGORITHM=y
# 旧 CONFIG_PMW3610_POLLING_RATE_125_SW 相当（8ms = 125Hz）
CONFIG_PMW3610_REPORT_INTERVAL_MIN=8
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=40
CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=9600
CONFIG_PMW3610_INVERT_Y=y
# 新ドライバーは inorichi 版と X 軸の向きが逆のため反転しない
# CONFIG_PMW3610_INVERT_X is not set

# ---- DYA Studio ----
CONFIG_ZMK_STUDIO=y
# Studio RPC buffers (frame capture / custom settings / nanopb encode)
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=128
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048

# トラックボール表面診断 (PMW3610 custom RPC)
CONFIG_ZMK_PMW3610_STUDIO_RPC=y

# ランタイム入力プロセッサー (トラックボール設定)
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y

# キースイッチ診断
CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_STUDIO_RPC=y

# BLE マネジメント (BLE 経由の Studio 接続 / プロファイル管理)
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y
CONFIG_ZMK_STUDIO_TRANSPORT_BLE=y
# 同時接続枠: 既定 6 (ホスト5 + 左半分1) に Studio 用の余裕を 1 枠追加
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7

# 左半分 (peripheral) の診断をリレーで取得 (左右両方で同じ値にすること)
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=256

# Battery
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10
